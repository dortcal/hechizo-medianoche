/* Layout: un único escenario 16:9 a sangre sobre la noche, con dos mandos discretos en la esquina */
:root {
  --night: #0b0716;
  --plum: #24123a;
  --pumpkin: #ff8a1f;
  --potion: #7cf05a;
  --bone: #fff3dc;
  --mist: #b9a8d6;
  --display: 'Creepster', 'Chiller', fantasy;
  --body: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--bone);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; background: var(--night); }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
#stage:fullscreen { background: var(--night); }
.controls {
  position: absolute;
  top: calc(8px + env(safe-area-inset-top, 0px));
  right: calc(8px + env(safe-area-inset-right, 0px));
  display: flex;
  gap: 8px;
}
.controls button {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid var(--mist);
  background: var(--plum);
  color: var(--bone);
  font: 800 18px/1 var(--body);
  cursor: pointer;
  opacity: .55;
  display: grid; place-items: center;
}
.controls button:hover { opacity: 1; }
.controls button:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: 2px; opacity: 1; }
.controls svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>

<body>
<div id="stage">
  <canvas id="c" aria-label="Juego Hechizo a Medianoche. Se juega con las flechas y la barra espaciadora o con una Makey Makey."></canvas>
  <div class="controls">
    <button id="btnPause" type="button" aria-label="Pausa" title="Pausa (Esc)">

    </button>
    <button id="btnMute" type="button" aria-label="Silenciar" title="Silenciar (M)">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button id="btnFull" type="button" aria-label="Pantalla completa" title="Pantalla completa">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================================================================ base */
const W = 1600, H = 900;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const DISPLAY = "Creepster, 'Chiller', fantasy";
const BODY = "'Baloo 2', 'Trebuchet MS', sans-serif";
const C = {
  bone: '#fff3dc', pumpkin: '#ff8a1f', pumpkinLight: '#ffb347', potion: '#7cf05a',
  plum: '#24123a', plumDeep: '#170b28', mist: '#b9a8d6', red: '#ff4d6d', gold: '#ffd84a', ink: '#120a20'
};
let scale = 1, offX = 0, offY = 0, dpr = 1;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let cScale = 1, cOffX = 0, cOffY = 0, viewW = W, viewH = H;
function resize() {
  const r = cv.getBoundingClientRect();
  viewW = r.width; viewH = r.height;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  scale = Math.min(r.width / W, r.height / H);
  offX = (r.width - W * scale) / 2;
  offY = (r.height - H * scale) / 2;
  cScale = Math.max(r.width / W, r.height / H);
  cOffX = (r.width - W * cScale) / 2;
  cOffY = (r.height - H * cScale) * 0.7;
  placeControls(true);
}
let ctlKey = '';
function placeControls(force) {
  const ctl = document.querySelector('.controls'); if (!ctl) return;
  const playing = typeof G !== 'undefined' && G.state === 'play';
  const portrait = typeof isPortrait === 'function' && isPortrait();
  const key = playing + '|' + portrait;
  if (!force && key === ctlKey) return; ctlKey = key;
  ctl.hidden = portrait;
  const narrow = (viewW - W * scale) / 2 < 120;
  if (!narrow) { ctl.style.top = ''; ctl.style.right = ''; return; }
  ctl.style.top = Math.round(offY + (playing ? 150 : 10) * scale) + 'px';
  ctl.style.right = Math.round(viewW - offX - 1576 * scale) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
};

/* ================================================================ audio */
const AudioEng = {
  ctx: null, master: null, music: null, sfx: null, noiseBuf: null, muted: store.get('hechizo-mute', false),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(comp); comp.connect(c.destination);
      this.music = c.createGain(); this.music.gain.value = 0.3; this.music.connect(this.master);
      this.sfx = c.createGain(); this.sfx.gain.value = 0.85; this.sfx.connect(this.master);
      const len = c.sampleRate * 2; this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m; store.set('hechizo-mute', m);
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05);
    document.getElementById('waves').style.display = m ? 'none' : '';
    document.getElementById('btnMute').setAttribute('aria-label', m ? 'Activar sonido' : 'Silenciar');
  },
  tone(f, d, o = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = f * 0.04; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05); }
    const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + d + 0.05);
  },
  noise(d, o = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 0.8;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + d);
    const g = c.createGain(); const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    s.start(t, Math.random() * 1.5); s.stop(t + d + 0.05);
  }
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const Sfx = {
  blip() { AudioEng.tone(660, 0.08, { type: 'square', vol: 0.08 }); },
  select() { AudioEng.tone(523, 0.1, { type: 'triangle', vol: 0.2 }); AudioEng.tone(784, 0.18, { type: 'triangle', vol: 0.2, delay: 0.08 }); },
  whoosh() { AudioEng.noise(0.5, { type: 'bandpass', freq: 400, to: 1600, vol: 0.12, attack: 0.15 }); },
  zap() { AudioEng.tone(1400, 0.25, { type: 'sawtooth', to: 180, vol: 0.12 }); AudioEng.noise(0.2, { type: 'highpass', freq: 3000, vol: 0.08 }); },
  boom() { AudioEng.noise(0.5, { freq: 900, to: 80, vol: 0.45 }); AudioEng.tone(140, 0.4, { to: 40, vol: 0.5 }); },
  correct() { [72, 76, 79, 84].forEach((m, i) => AudioEng.tone(mtof(m), 0.22, { type: 'triangle', vol: 0.22, delay: 0.06 * i })); },
  wrong() { AudioEng.tone(311, 0.25, { type: 'square', vol: 0.1 }); AudioEng.tone(233, 0.45, { type: 'square', vol: 0.1, delay: 0.22, to: 180 }); },
  laugh() { [620, 560, 500, 450, 400].forEach((f, i) => AudioEng.tone(f, 0.11, { type: 'sawtooth', vol: 0.07, to: f * 0.85, delay: 0.32 + i * 0.13 })); },
  heartbeat() { AudioEng.tone(70, 0.18, { vol: 0.35, to: 45 }); AudioEng.tone(65, 0.16, { vol: 0.25, to: 42, delay: 0.17 }); },
  thunder() { AudioEng.noise(2.2, { freq: 500, to: 60, vol: 0.55, attack: 0.02 }); AudioEng.noise(0.3, { type: 'highpass', freq: 1500, vol: 0.2 }); },
  spell() { AudioEng.tone(200, 0.9, { type: 'sawtooth', to: 1600, vol: 0.12 }); [84, 88, 91, 96].forEach((m, i) => AudioEng.tone(mtof(m), 0.5, { type: 'sine', vol: 0.12, delay: 0.3 + i * 0.07 })); },
  denied() { AudioEng.tone(160, 0.2, { type: 'square', vol: 0.08 }); },
  combo() { [79, 83, 86, 91].forEach((m, i) => AudioEng.tone(mtof(m), 0.16, { type: 'square', vol: 0.08, delay: 0.05 * i })); },
  tick() { AudioEng.tone(880, 0.1, { type: 'triangle', vol: 0.25 }); },
  go() { AudioEng.tone(1320, 0.4, { type: 'triangle', vol: 0.25 }); },
  roar() { AudioEng.tone(90, 1.6, { type: 'sawtooth', to: 45, vol: 0.3, vib: 9, attack: 0.1 }); AudioEng.noise(1.4, { freq: 300, vol: 0.25, attack: 0.1 }); },
  bossHit() { AudioEng.noise(0.6, { freq: 2000, to: 100, vol: 0.5 }); AudioEng.tone(220, 0.5, { type: 'square', to: 55, vol: 0.2 }); },
  attack() { AudioEng.noise(0.4, { type: 'bandpass', freq: 600, to: 200, vol: 0.3 }); AudioEng.tone(300, 0.35, { type: 'sawtooth', to: 90, vol: 0.12 }); },
  fanfare() { [[67, 0], [72, 0.15], [76, 0.3], [79, 0.45], [76, 0.62], [79, 0.78], [84, 0.95]].forEach(([m, d]) => { AudioEng.tone(mtof(m), 0.35, { type: 'square', vol: 0.09, delay: d }); AudioEng.tone(mtof(m - 12), 0.35, { type: 'triangle', vol: 0.15, delay: d }); }); },
  pop() { AudioEng.tone(rand(500, 900), 0.08, { to: 1500, vol: 0.06 }); },
  firework() { AudioEng.noise(0.8, { freq: 1800, to: 200, vol: 0.18 }); }
};

const Music = {
  on: false, mode: 'menu', step: 0, next: 0, timer: null,
  chords: [[57, 60, 64, 69], [53, 57, 60, 65], [50, 53, 57, 62], [52, 56, 59, 64]],
  start(mode) {
    this.mode = mode;
    if (!AudioEng.ctx || this.on) return;
    this.on = true; this.step = 0; this.next = AudioEng.ctx.currentTime + 0.08;
    this.timer = setInterval(() => this.tick(), 25);
  },
  tick() {
    const c = AudioEng.ctx; if (!c) return;
    while (this.next < c.currentTime + 0.12) {
      this.play(this.step, this.next);
      const bpm = this.mode === 'boss' ? 140 : this.mode === 'play' ? 116 : 92;
      this.next += 60 / bpm / 4;
      this.step = (this.step + 1) % 64;
    }
  },
  play(s, t) {
    const bar = Math.floor(s / 16), st = s % 16, ch = this.chords[bar];
    const D = AudioEng.music;
    if (st % 2 === 0) {
      const arp = [0, 1, 2, 3, 2, 1, 2, 1];
      AudioEng.tone(mtof(ch[arp[st / 2]] + 12), 0.4, { type: 'triangle', vol: 0.14, at: t, dest: D });
    }
    if (st === 0 || st === 8 || (this.mode !== 'menu' && st === 14)) AudioEng.tone(mtof(ch[0] - 12), 0.45, { type: 'sine', vol: 0.4, at: t, dest: D });
    if (this.mode !== 'menu') {
      if (st % 4 === 0) AudioEng.tone(150, 0.18, { to: 45, vol: 0.45, at: t, dest: D });
      if (st % 4 === 2) AudioEng.noise(0.05, { type: 'highpass', freq: 7000, vol: 0.07, at: t, dest: D });
    }
    if (this.mode === 'boss' && st % 2 === 1) AudioEng.tone(mtof(ch[0] - 24), 0.12, { type: 'sawtooth', vol: 0.1, at: t, dest: D });
    if (this.mode === 'menu' && s === 0) AudioEng.tone(mtof(81), 2.4, { type: 'sine', vol: 0.05, at: t, vib: 5.5, attack: 0.6, dest: D, to: mtof(76) });
  }
};

/* ================================================================ dibujo: utilidades */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function txt(str, x, y, o = {}) {
  const size = o.size || 40, disp = o.font === 'display';
  let s = size;
  const font = () => (disp ? '' : (o.weight || 800) + ' ') + s + 'px ' + (disp ? DISPLAY : BODY);
  ctx.save();
  ctx.font = font();
  if (o.maxW) while (ctx.measureText(str).width > o.maxW && s > 12) { s -= 2; ctx.font = font(); }
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 8; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || size * 0.45; }
  ctx.fillStyle = o.color || C.bone;
  ctx.fillText(str, x, y);
  ctx.restore();
  return s;
}
function measure(str, size, weight = 800) { ctx.save(); ctx.font = weight + ' ' + size + 'px ' + BODY; const w = ctx.measureText(str).width; ctx.restore(); return w; }
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function star5(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath();
}
function arrowGlyph(x, y, dir, size, color) {
  const ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir];
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(size / 20, size / 20);
  ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(1, -4); ctx.lineTo(1, -10); ctx.lineTo(11, 0); ctx.lineTo(1, 10); ctx.lineTo(1, 4); ctx.lineTo(-9, 4); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
}

/* ================================================================ personajes */
function withGlow(o) { if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowSize || 34; } }

function drawGhost(x, y, s, t, o = {}) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 3) * 6 * s); ctx.scale(s, s);
  const wave = Math.sin(t * 4) * 0.25;
  ctx.fillStyle = '#f6f2ff'; ctx.strokeStyle = '#9b8fc0'; ctx.lineWidth = 4;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 46, 10); ctx.rotate(side * (o.scary ? -0.9 : 0.3 + wave));
    ctx.beginPath(); ctx.ellipse(side * 8, -14, 11, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.beginPath(); ctx.moveTo(-50, 45); ctx.lineTo(-50, -10); ctx.arc(0, -10, 50, Math.PI, 0); ctx.lineTo(50, 45);
  const n = 6;
  for (let i = 1; i <= n; i++) { const xx = 50 - i * (100 / n); ctx.quadraticCurveTo(xx + 100 / n / 2, 62 + Math.sin(t * 6 + i) * 5, xx, 45 + Math.sin(t * 6 + i * 1.7) * 4); }
  ctx.closePath();
  ctx.save(); withGlow(o); ctx.fill(); ctx.restore(); ctx.stroke();
  const blink = (Math.sin(t * 1.3 + x) > 0.985) ? 0.15 : 1;
  ctx.fillStyle = '#1b1030';
  if (o.scary) {
    ctx.beginPath(); ctx.ellipse(-18, -16, 10, 14, 0, 0, Math.PI * 2); ctx.ellipse(18, -16, 10, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 20, 13, 17 + Math.sin(t * 20) * 3, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(-17, -12, 7, 11 * blink, 0, 0, Math.PI * 2); ctx.ellipse(17, -12, 7, 11 * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 8, 9, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,140,180,.7)';
    ctx.beginPath(); ctx.ellipse(-29, 6, 7, 4, 0, 0, Math.PI * 2); ctx.ellipse(29, 6, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawPumpkin(x, y, s, t, o = {}) {
  const sq = o.still ? 0 : Math.sin(t * 5) * 0.05;

    const mult = G.combo >= 6 ? 3 : G.combo >= 3 ? 2 : 1;

  }
  ctx.save(); rr(1246, 20, 330, 92, 22); ctx.fillStyle = 'rgba(16,8,30,.72)'; ctx.fill(); ctx.restore();
  for (let i = 0; i < 5; i++) { ctx.save(); ctx.globalAlpha = i < G.lives ? 1 : 0.22; drawPumpkin(1530 - i * 64, 66, 0.4, t + i, { dark: i >= G.lives, still: i >= G.lives }); ctx.restore(); }
  const label = G.boss.active ? '¡JEFE FINAL!' : `Pregunta ${Math.min(G.qIndex, NORMAL_Q)} de ${NORMAL_Q}`;
  txt(label, 1564, 130, { size: 22, color: G.boss.active ? C.pumpkin : C.mist, align: 'right' });
  if (G.boss.active && G.phase !== 'bossIntro') {

    for (let i = 0; i < G.boss.max; i++) {
      ctx.save(); rr(704 + i * 66, 50, 58, 18, 9); ctx.fillStyle = i < G.boss.hp ? C.pumpkin : 'rgba(255,255,255,.12)'; ctx.fill(); ctx.restore();
    }
  }
  const mx = 24, my = 790, mw = 360;
  ctx.save(); rr(mx, my, mw + 40, 86, 22); ctx.fillStyle = 'rgba(16,8,30,.72)'; ctx.fill(); ctx.restore();
  const full = G.potion >= 100;
  txt(full ? '¡SUPERHECHIZO LISTO!' : 'SUPERHECHIZO', mx + 20, my + 24, { size: 22, color: full ? (Math.sin(t * 8) > 0 ? C.potion : C.bone) : C.mist, align: 'left' });
  txt('ESPACIO', mx + mw + 20, my + 24, { size: 18, color: full ? C.potion : C.mist, align: 'right' });
  ctx.save(); rr(mx + 20, my + 44, mw, 26, 13); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fill();
  if (G.potion > 0) {
    rr(mx + 20, my + 44, Math.max(26, mw * G.potion / 100), 26, 13);
    const gr = ctx.createLinearGradient(mx, 0, mx + mw, 0); gr.addColorStop(0, '#3bd12a'); gr.addColorStop(1, full ? `hsl(${(t * 120) % 360},90%,65%)` : '#a6ff7a');
    ctx.fillStyle = gr; if (full) { ctx.shadowColor = C.potion; ctx.shadowBlur = 20; } ctx.fill();
  }
  if (G.meterPulse > 0) { rr(mx + 20, my + 44, mw, 26, 13); ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,77,109,${G.meterPulse})`; ctx.stroke(); }
  ctx.restore();
  const tm = TEAMS[G.team];
  ctx.save(); rr(1196, 790, 380, 86, 22); ctx.fillStyle = 'rgba(16,8,30,.72)'; ctx.fill(); ctx.restore();
  drawIcon(tm.icon, 1250, 833, 64, t);
  txt('Equipo', 1300, 814, { size: 20, color: C.mist, align: 'left' });
  txt(tm.name, 1300, 848, { size: 34, color: tm.color, align: 'left', maxW: 260 });
}
function drawPlay(t) {
  drawCauldron(CAUL.x, CAUL.y, t, G.potion, G.combo);
  for (const m of G.monsters) drawMonster(m, t);
  if (G.phase === 'asking' || G.phase === 'feedback') drawQuestion(t);
  drawHud(t);
  if (G.phase === 'countdown') {
    const n = Math.ceil(G.timer - 0.6);
    const k = (G.timer - 0.6) % 1;
    const label = n >= 1 ? String(n) : '¡A JUGAR!';
    const sc = 0.7 + 0.5 * (n >= 1 ? k : 1);
    ctx.save(); ctx.translate(800, 340); ctx.scale(sc, sc);
    txt(label, 0, 0, { size: 180, font: 'display', color: n >= 1 ? C.pumpkin : C.potion, glow: '#ffffff', blur: 30, stroke: '#1a0b2a', sw: 16 });
    ctx.restore();
    txt(SUBJECTS.find(s => s.id === G.subject).full + ' · ' + DIFFS[G.diff].name, 800, 500, { size: 36, color: C.bone });
  }
}

/* ================================================================ render: menús y pantallas */
function panel(x, y, w, h, r = 26, fill = 'rgba(18,9,32,.84)') { ctx.save(); rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.restore(); }
function footer(str) { txt(str, 800, 862, { size: 26, color: C.mist }); }
function drawTitle(t) {
  const bob = Math.sin(t * 1.5) * 8;
  ctx.save(); ctx.translate(800, 250 + bob); ctx.rotate(Math.sin(t * 0.8) * 0.015);
  txt('HECHIZO A', 0, -110, { size: 74, font: 'display', color: C.bone, glow: '#b48cff', stroke: '#1a0b2a', sw: 10 });
  txt('MEDIANOCHE', 0, 10, { size: 172, font: 'display', color: C.pumpkin, glow: '#ff5a00', blur: 50, stroke: '#1a0b2a', sw: 16 });
  ctx.restore();
  txt('Un juego de hechizos, monstruos y Makey Makey', 800, 410, { size: 34, color: C.mist });
  const pts = [['ghost', 300], ['bat', 540], ['pumpkin', 1060], ['cat', 1300]];
  pts.forEach(([type, x], i) => {
    const y = 590 + Math.sin(t * 2 + i) * 10;
    ({ ghost: drawGhost, pumpkin: drawPumpkin, bat: drawBat, cat: drawCat })[type](x, y, 1.05, t + i);
  });
  drawCauldron(800, 640, t, 0, 0);
  const a = 0.6 + 0.4 * Math.sin(t * 4);
  txt('Toca el caldero o pulsa ESPACIO para empezar', 800, 800, { size: 40, color: C.potion, glow: '#3bd12a', alpha: a });
  const best = G.records[0];
  if (best) txt(`Récord de la noche: ${best.score} puntos · Equipo ${best.team}`, 800, 856, { size: 24, color: C.mist });
  txt('Diseñado por David OZC', 1570, 872, { size: 22, color: C.mist, align: 'right', weight: 600, alpha: 0.85 });
  if (IS_IOS && !FS_OK && !IS_STANDALONE) {
    panel(380, 20, 840, 58, 29, 'rgba(255,138,31,.95)');
    txt('Pantalla completa: Compartir  →  Añadir a pantalla de inicio', 800, 50, { size: 26, color: C.ink, maxW: 800 });
  } else if (!IS_TOUCH && !document.hasFocus()) {
    panel(470, 20, 660, 58, 29, 'rgba(255,138,31,.95)');
    txt('Haz clic en el juego para que escuche el teclado', 800, 50, { size: 26, color: C.ink });
  }
}
function drawCards(t, items, title, sub, renderCard) {
  txt(title, 800, 110, { size: 88, font: 'display', color: C.pumpkin, glow: '#ff5a00', stroke: '#1a0b2a', sw: 10 });
  txt(sub, 800, 186, { size: 30, color: C.mist });
  const n = items.length, cw = n >= 5 ? 268 : n === 4 ? 300 : 340, ch = 380, gap = 26;
  const total = n * cw + (n - 1) * gap, x0 = 800 - total / 2;
  const sel = G.menu[G.state];
  G.cards = [];
  items.forEach((it, i) => {
    const x = x0 + i * (cw + gap), on = i === sel;
    const lift = on ? -18 + Math.sin(t * 4) * 4 : 0, y = 260 + lift;
    G.cards.push({ x, y: 260, w: cw, h: ch });
    ctx.save();
    if (on) { ctx.shadowColor = C.pumpkin; ctx.shadowBlur = 40; }
    rr(x, y, cw, ch, 28); ctx.fillStyle = on ? 'rgba(52,24,78,.96)' : 'rgba(22,11,38,.86)'; ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = on ? 6 : 3; ctx.strokeStyle = on ? C.pumpkin : 'rgba(185,168,214,.35)'; ctx.stroke();
    ctx.restore();
    renderCard(it, i, x + cw / 2, y, cw, on);
  });
  footer('← →  elegir     ·     ESPACIO  confirmar     ·     ESC  volver');
}
function drawSubject(t) {
  drawCards(t, SUBJECTS, 'Elige el hechizo', '¿Qué vamos a practicar esta noche?', (it, i, cx, y, w, on) => {
    if (it.sym === 'icons') { drawIcon('pumpkin', cx - 60, y + 120, 54, t); drawIcon('ghost', cx, y + 120, 54, t); drawIcon('pumpkin', cx + 60, y + 120, 54, t); }
    else txt(it.sym, cx, y + 124, { size: 96, color: on ? C.gold : C.bone });
    txt(it.name, cx, y + 236, { size: 36, color: C.bone, maxW: w - 30 });
    txt(it.full, cx, y + 290, { size: 22, color: C.mist, maxW: w - 30 });
  });
}
function drawDiff(t) {
  const subj = SUBJECTS.find(s => s.id === G.subject);
  drawCards(t, DIFFS, 'Elige la dificultad', subj.full, (it, i, cx, y, w, on) => {
    for (let k = 0; k < 3; k++) { ctx.save(); ctx.fillStyle = k <= i ? C.gold : 'rgba(255,255,255,.15)'; star5(cx - 60 + k * 60, y + 100, 26, 0); ctx.fill(); ctx.restore(); }
    txt(it.name, cx, y + 190, { size: 40, color: C.bone, maxW: w - 30 });
    txt(subj.levels[i], cx, y + 250, { size: 28, color: on ? C.potion : C.mist, maxW: w - 30 });
    txt(it.speed, cx, y + 300, { size: 24, color: C.mist, maxW: w - 30 });
  });
}
function drawTeam(t) {
  drawCards(t, TEAMS, '¿Qué equipo juega?', 'Cada equipo guarda su récord', (it, i, cx, y, w, on) => {
    drawIcon(it.icon, cx, y + 140, on ? 150 : 130, t);
    txt(it.name, cx, y + 290, { size: 40, color: it.color, maxW: w - 30 });
  });
}
function drawHowto(t) {
  txt('Cómo se juega', 800, 92, { size: 88, font: 'display', color: C.pumpkin, glow: '#ff5a00', stroke: '#1a0b2a', sw: 10 });
  panel(150, 150, 1300, 600);
  const cx = 560, cy = 450;
  drawCauldron(cx, cy + 40, t, 0, 0);
  const spots = [['left', 'ghost', cx - 300, cy], ['right', 'pumpkin', cx + 300, cy], ['up', 'bat', cx, cy - 200], ['down', 'cat', cx, cy + 228]];
  for (const [dir, type, x, y] of spots) {

    const bx = dir === 'left' ? x + 80 : dir === 'right' ? x - 80 : x + 90, by = dir === 'up' || dir === 'down' ? y : y - 70;
    ctx.save(); ctx.fillStyle = C.pumpkin; ctx.beginPath(); ctx.arc(bx, by, 26, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    arrowGlyph(bx, by, dir, 30, C.ink);
  }
  const lx = 940;
  const lines = [
    ['Cuatro monstruos traen respuestas.', C.bone],
    ['Toca la flecha del que lleva', C.bone], ['la respuesta correcta.', C.bone],
    ['¡Antes de que llegue al caldero!', C.pumpkin],
    ['', C.bone],
    ['Acierta para llenar la poción.', C.bone], ['Llena: toca el caldero (ESPACIO)', C.potion], ['y borra 2 respuestas falsas.', C.potion],
    ['', C.bone],
    ['3 aciertos seguidos: puntos ×2', C.gold], ['Al final… ¡el jefe!', C.gold]
  ];
  lines.forEach(([s, c], i) => txt(s, lx, 220 + i * 46, { size: 32, color: c, align: 'left' }));
  const a = 0.6 + 0.4 * Math.sin(t * 4);
  txt('ESPACIO para empezar', 800, 806, { size: 44, color: C.potion, glow: '#3bd12a', alpha: a });
}
function drawResult(t) {
  const R = G.result; if (!R) return;
  const k = Math.min(1, G.st / 0.6);
  ctx.save(); ctx.translate(800, 96); ctx.scale(easeOutBack(k), easeOutBack(k));
  txt(R.win ? '¡Noche superada!' : '¡Los monstruos ganaron esta vez!', 0, 0, { size: R.win ? 100 : 72, font: 'display', color: R.win ? C.gold : C.pumpkin, glow: R.win ? '#ff8a1f' : '#ff3d00', stroke: '#1a0b2a', sw: 12 });
  ctx.restore();
  panel(120, 170, 700, 600);
  for (let i = 0; i < 3; i++) {
    const on = i < R.stars, sk = clamp((G.st - 0.5 - i * 0.35) / 0.4, 0, 1);
    if (sk > 0 && on && !R['star' + i]) { R['star' + i] = true; Sfx.pop(); burst(330 + i * 140, 270, { n: 24, colors: [C.gold, '#ffffff'], max: 300, g: 300 }); }
    ctx.save(); ctx.translate(330 + i * 140, 270); const sc = on ? easeOutBack(sk) : 1; ctx.scale(sc || 0.001, sc || 0.001);
    ctx.fillStyle = on ? C.gold : 'rgba(255,255,255,.14)'; if (on) { ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 30; }
    star5(0, 0, 56, 0); ctx.fill(); ctx.restore();
  }
  const rank = R.stars === 3 ? 'Leyenda de medianoche' : R.stars === 2 ? 'Hechicería experta' : R.stars === 1 ? 'Aprendiz del caldero' : 'Calabaza valiente';
  txt(rank, 470, 368, { size: 40, color: C.potion });
  const rows = [['Puntos', String(G.score)], ['Aciertos', `${G.correct} de ${G.answered}`], ['Mejor racha', String(G.best)]];
  rows.forEach(([a, b], i) => { txt(a, 180, 432 + i * 52, { size: 32, color: C.mist, align: 'left' }); txt(b, 760, 432 + i * 52, { size: 36, color: C.bone, align: 'right' }); });
  if (R.misses.length) {
    txt('Repaso del hechizo', 180, 600, { size: 28, color: C.pumpkin, align: 'left' });
    R.misses.forEach((q, i) => {
      const y = 642 + i * 32, x = 180;
      if (q.kind === 'pattern') {
        q.seq.slice(-4).forEach((ic, j) => drawIcon(ic, x + 16 + j * 34, y, 28, 0));
        txt('→', x + 160, y, { size: 26, color: C.mist }); drawIcon(q.answers[q.correct].icon, x + 196, y, 28, 0);
      } else txt(q.kind === 'spell' ? `Se escribe «${q.explain}»` : q.explain, x, y, { size: 26, color: C.bone, align: 'left', maxW: 600 });
    });
  } else txt('¡Sin fallos! Un hechizo perfecto.', 180, 620, { size: 30, color: C.potion, align: 'left' });
  panel(860, 170, 620, 600);
  txt('Salón de la fama', 1170, 220, { size: 52, font: 'display', color: C.pumpkin });
  G.records.forEach((r, i) => {
    const y = 300 + i * 74, mine = r.id === R.entry.id;
    if (mine) { ctx.save(); rr(884, y - 32, 572, 64, 18); ctx.fillStyle = `rgba(255,138,31,${0.18 + 0.08 * Math.sin(t * 5)})`; ctx.fill(); ctx.restore(); }
    txt(String(i + 1), 914, y, { size: 34, color: i === 0 ? C.gold : C.mist });
    drawIcon(r.icon, 970, y, 48, t);
    txt(r.team, 1010, y - 10, { size: 30, color: C.bone, align: 'left', maxW: 260 });
    txt(r.subject, 1010, y + 18, { size: 20, color: C.mist, align: 'left' });
    txt(String(r.score), 1440, y, { size: 36, color: mine ? C.gold : C.bone, align: 'right' });
  });
  if (G.st > 1.5) footer('ESPACIO  otro equipo, mismo reto     ·     ←  cambiar de reto');
}
const PAUSE_BTNS = [{ id: 'resume', label: 'Seguir', key: 'ESPACIO', x: 470, y: 470, w: 300, h: 110 }, { id: 'menu', label: 'Salir al menú', key: '←', x: 830, y: 470, w: 300, h: 110 }];
function drawPause(t) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(8,4,18,.9)'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
  txt('Pausa', 800, 330, { size: 150, font: 'display', color: C.pumpkin, glow: '#ff5a00' });
  for (const b of PAUSE_BTNS) {
    ctx.save(); rr(b.x, b.y, b.w, b.h, 28);
    ctx.fillStyle = b.id === 'resume' ? 'rgba(124,240,90,.18)' : 'rgba(255,138,31,.16)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = b.id === 'resume' ? C.potion : C.pumpkin; ctx.stroke(); ctx.restore();
    txt(b.label, b.x + b.w / 2, b.y + 46, { size: 40, color: C.bone, maxW: b.w - 30 });
    txt(b.key, b.x + b.w / 2, b.y + 86, { size: 22, color: C.mist });
  }
  if (!IS_TOUCH && !document.hasFocus()) txt('Haz clic en el juego para que vuelva a escuchar las teclas', 800, 660, { size: 28, color: C.mist });
}
function drawRotate(t) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(11,7,22,.96)'; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = Math.min(viewW / 420, viewH / 640) * dpr;
  ctx.setTransform(s, 0, 0, s, cv.width / 2, cv.height / 2);
  const a = -Math.PI / 2 * Math.min(1, Math.max(0, Math.sin(t * 1.6) * 1.3 + 0.3));
  ctx.save(); ctx.rotate(a); rr(-70, -120, 140, 240, 22); ctx.lineWidth = 8; ctx.strokeStyle = C.pumpkin; ctx.stroke();
  ctx.fillStyle = C.pumpkin; ctx.beginPath(); ctx.arc(0, 98, 8, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  txt('Gira el dispositivo', 0, 190, { size: 40, color: C.bone });
  txt('El juego se ve en horizontal', 0, 236, { size: 26, color: C.mist });
  ctx.restore();
}

/* ================================================================ bucle */
let last = performance.now(), T0 = last;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - T0) / 1000;
  update(dt, t);
  if (isPortrait() && G.state === 'play' && G.phase !== 'countdown' && G.phase !== 'victory') G.paused = true;
  const bp = document.getElementById('btnPause'), showPause = G.state === 'play';
  if (bp.hidden === showPause) bp.hidden = !showPause;
  placeControls(false);
  if (!G.paused) updateEffects(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0716'; ctx.fillRect(0, 0, cv.width, cv.height);
  shX = shake > 0.5 && !reduceMotion ? rand(-shake, shake) : 0; shY = shake > 0.5 && !reduceMotion ? rand(-shake, shake) : 0;
  ctx.save();
  setCoverTransform();
  drawBackground(t, G.paused ? 0 : dt);
  setGameTransform();
  if (G.state === 'title') drawTitle(t);
  else if (G.state === 'subject') drawSubject(t);
  else if (G.state === 'diff') drawDiff(t);
  else if (G.state === 'team') drawTeam(t);
  else if (G.state === 'howto') drawHowto(t);
  else if (G.state === 'play') drawPlay(t);
  else if (G.state === 'result') drawResult(t);
  drawEffects();
  if (flash > 0) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(${flashColor},${Math.min(0.85, flash) * (reduceMotion ? 0.3 : 1)})`; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); }
  if (G.paused) drawPause(t);
  if (isPortrait()) drawRotate(t);
  ctx.restore();
  requestAnimationFrame(frame);
}

function start() {
  resize(); buildLayers();
  AudioEng.setMuted(AudioEng.muted);
  window.__hechizo = { G, input };
  requestAnimationFrame(frame);
}
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.race([Promise.all([document.fonts.load("80px Creepster"), document.fonts.load("800 40px 'Baloo 2'")]), new Promise(r => setTimeout(r, 2500))])
  : Promise.resolve();
fontsReady.catch(() => {}).then(() => {
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
});
})();
